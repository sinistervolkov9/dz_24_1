{% extends 'base.html' %}
{% load static %}

{% block content %}
<h1>{% if object %}Редактировать Курс{% else %}Создать курс{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'lms:course_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
